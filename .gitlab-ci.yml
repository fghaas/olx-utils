image: python

py311:
  image: python:3.11
  stage: build
  script:
    - pip install tox
    - tox -e py311,flake8
  artifacts:
    paths:
      - .coverage*
    expire_in: 5 minutes

py312:
  image: python:3.12
  stage: build
  script:
    - pip install tox
    - tox -e py312,flake8
  artifacts:
    paths:
      - .coverage*
    expire_in: 5 minutes

py313:
  image: python:3.13
  stage: build
  script:
    - pip install tox
    - tox -e py313,flake8
  artifacts:
    paths:
      - .coverage*
    expire_in: 5 minutes

py314:
  image: python:3.14
  stage: build
  script:
    - pip install tox
    - tox -e py314,flake8
  artifacts:
    paths:
      - .coverage*
    expire_in: 5 minutes

coverage:
  stage: test
  script:
    - pip install coverage
    - python -m coverage combine
    - python -m coverage html
    - python -m coverage report
  coverage: '/TOTAL.*\s+(\d+\.\d+%)$/'
  artifacts:
    paths:
      - htmlcov
    expire_in: 1 week
